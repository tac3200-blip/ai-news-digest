<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Daily Digest | 毎日更新 AIニュース要約</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-read-bg: rgba(15, 23, 42, 0.5);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-purple: #818cf8;
      --accent-cyan: #38bdf8;
      --accent-pink: #f472b6;
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 50px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(11, 15, 25, 0.85);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 16px;
    }

    .header-content {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: white;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .update-badge {
      font-size: 0.75rem;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .update-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background-color: #38bdf8;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #38bdf8;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    /* カテゴリタブナビゲーション */
    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.83rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(168, 85, 247, 0.4));
      border-color: var(--accent-purple);
      color: white;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
    }

    .count-pill {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 7px;
      border-radius: 10px;
    }

    /* ニュースカード */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .news-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: var(--glass-shadow);
      transition: all 0.25s ease;
      position: relative;
    }

    /* 既読状態のスタイル */
    .news-card.is-read {
      background: var(--card-read-bg);
      opacity: 0.6;
      border-color: rgba(255, 255, 255, 0.04);
    }
    .news-card.is-read:hover {
      opacity: 0.9;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      letter-spacing: 0.02em;
    }

    .cat-3dai { background: rgba(168, 85, 247, 0.25); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
    .cat-kokunai { background: rgba(56, 189, 248, 0.25); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .cat-default { background: rgba(99, 102, 241, 0.25); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.4); }

    .read-badge {
      display: none;
      font-size: 0.7rem;
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .news-card.is-read .read-badge {
      display: inline-block;
    }

    .source-name {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .news-title {
      font-size: 1.02rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 10px;
      color: #f1f5f9;
      cursor: pointer;
    }

    .news-card.is-read .news-title {
      color: #94a3b8;
    }

    .summary-list {
      list-style: none;
      margin-bottom: 12px;
      background: rgba(15, 23, 42, 0.45);
      padding: 10px 12px;
      border-radius: 10px;
      border-left: 3px solid var(--accent-purple);
    }

    .summary-item {
      font-size: 0.86rem;
      line-height: 1.55;
      color: #cbd5e1;
      position: relative;
      padding-left: 14px;
      margin-bottom: 5px;
    }

    .summary-item:last-child {
      margin-bottom: 0;
    }

    .summary-item::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--accent-cyan);
      font-weight: bold;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    .pub-date {
      font-size: 0.75rem;
      color: #64748b;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-read-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .toggle-read-btn:hover {
      color: var(--text-secondary);
    }

    .read-more {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent-cyan);
      text-decoration: none;
    }

    .read-more:hover {
      text-decoration: underline;
    }

    /* 空状態 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      background: rgba(30, 41, 59, 0.4);
      border-radius: 16px;
      border: 1px dashed var(--card-border);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="brand">
        <div class="brand-icon">AI</div>
        <div class="brand-title">AI Daily Digest</div>
      </div>
      <div class="update-badge" id="update-time">取得中...</div>
    </div>
  </header>

  <div class="container">
    <!-- カテゴリフィルター -->
    <div class="filter-scroll" id="category-filters">
      <button class="filter-btn active" onclick="filterCategory('all', this)">
        すべて <span class="count-pill" id="count-all">0</span>
      </button>
      <button class="filter-btn" onclick="filterCategory('国内主要AI情報', this)">
        🇯🇵 国内主要AI情報 <span class="count-pill" id="count-kokunai">0</span>
      </button>
      <button class="filter-btn" onclick="filterCategory('3大AI情報', this)">
        🌍 3大AI情報 <span class="count-pill" id="count-3dai">0</span>
      </button>
      <button class="filter-btn" onclick="filterCategory('read', this)">
        ✔ 既読済み <span class="count-pill" id="count-read">0</span>
      </button>
    </div>

    <!-- 記事一覧 -->
    <div class="news-list" id="news-container">
      <div class="empty-state">
        <div class="spinner"></div>
        <p>最新ニュースを読み込み中...</p>
      </div>
    </div>
  </div>

  <script>
    let allArticles = [];
    let readArticleIds = new Set(JSON.parse(localStorage.getItem('read_articles') || '[]'));
    let currentFilter = 'all';

    async function loadNews() {
      const container = document.getElementById('news-container');
      const updateTime = document.getElementById('update-time');

      try {
        const response = await fetch('data/news.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('データが見つかりません');
        
        const data = await response.json();
        allArticles = data.articles || [];
        updateTime.textContent = data.updated_at ? `${data.updated_at} 更新` : '更新完了';

        updateCounts();
        renderArticles();
      } catch (error) {
        console.error('Error:', error);
        container.innerHTML = `
          <div class="empty-state">
            <p style="margin-bottom: 8px; font-weight: bold; color: #f87171;">データを読み込めませんでした</p>
            <p style="font-size: 0.85rem;">自動要約更新ジョブの完了をお待ちください。</p>
          </div>
        `;
        updateTime.textContent = '未更新';
      }
    }

    function updateCounts() {
      document.getElementById('count-all').textContent = allArticles.length;
      
      const kokunaiCount = allArticles.filter(a => isKokunai(a)).length;
      document.getElementById('count-kokunai').textContent = kokunaiCount;

      const sangdaiCount = allArticles.filter(a => is3Dai(a)).length;
      document.getElementById('count-3dai').textContent = sangdaiCount;

      const readCount = allArticles.filter(a => readArticleIds.has(a.id || a.link)).length;
      document.getElementById('count-read').textContent = readCount;
    }

    function isKokunai(art) {
      const cat = art.category || '';
      const src = art.source_name || '';
      return cat.includes('国内') || src.includes('ITmedia') || src.includes('PIVOT') || src.includes('GIGAZINE');
    }

    function is3Dai(art) {
      const cat = art.category || '';
      const src = art.source_name || '';
      return cat.includes('3大') || src.includes('TechCrunch') || src.includes('Verge');
    }

    function renderArticles() {
      const container = document.getElementById('news-container');
      
      let filtered = allArticles;

      if (currentFilter === '国内主要AI情報') {
        filtered = allArticles.filter(a => isKokunai(a));
      } else if (currentFilter === '3大AI情報') {
        filtered = allArticles.filter(a => is3Dai(a));
      } else if (currentFilter === 'read') {
        filtered = allArticles.filter(a => readArticleIds.has(a.id || a.link));
      }

      if (!filtered || filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>該当する記事はありません。</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(art => {
        const artId = art.id || art.link;
        const isRead = readArticleIds.has(artId);
        const categoryClass = getCategoryClass(art);
        const summaries = Array.isArray(art.summary) ? art.summary : [art.summary];
        
        return `
          <div class="news-card ${isRead ? 'is-read' : ''}" id="card-${artId}">
            <div class="card-meta">
              <div class="meta-left">
                <span class="category-tag ${categoryClass}">${escapeHtml(art.category || 'AIニュース')}</span>
                <span class="read-badge">✓ 既読</span>
              </div>
              <span class="source-name">📡 ${escapeHtml(art.source_name || 'WEB')}</span>
            </div>
            <h2 class="news-title" onclick="toggleReadStatus('${artId}')">${escapeHtml(art.title)}</h2>
            <ul class="summary-list">
              ${summaries.map(s => `<li class="summary-item">${escapeHtml(s)}</li>`).join('')}
            </ul>
            <div class="card-footer">
              <span class="pub-date">📅 ${escapeHtml(art.published || '')}</span>
              <div class="action-group">
                <button class="toggle-read-btn" onclick="toggleReadStatus('${artId}')">
                  ${isRead ? '未読に戻す' : '既読にする'}
                </button>
                <a href="${escapeHtml(art.link)}" target="_blank" rel="noopener noreferrer" class="read-more" onclick="markAsRead('${artId}')">
                  元記事を読む ↗
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCategory(cat, btnElement) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      renderArticles();
    }

    function markAsRead(id) {
      readArticleIds.add(id);
      localStorage.setItem('read_articles', JSON.stringify(Array.from(readArticleIds)));
      updateCounts();
      const card = document.getElementById(`card-${id}`);
      if (card) card.classList.add('is-read');
    }

    function toggleReadStatus(id) {
      if (readArticleIds.has(id)) {
        readArticleIds.delete(id);
      } else {
        readArticleIds.add(id);
      }
      localStorage.setItem('read_articles', JSON.stringify(Array.from(readArticleIds)));
      updateCounts();
      renderArticles();
    }

    function getCategoryClass(art) {
      if (is3Dai(art)) return 'cat-3dai';
      if (isKokunai(art)) return 'cat-kokunai';
      return 'cat-default';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    loadNews();
  </script>
</body>
</html>
